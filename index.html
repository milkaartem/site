<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines Bot</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container py-3">
        <div class="row mb-2">
            <div class="col-12 text-center">
                <h1 class="mb-1">Mines Bot</h1>
                <p class="subtitle">by xenoGD</p>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12 text-center info-block">
                <div id="chance" class="chance-value">Chance: ?%</div>
                <div id="hash" class="hash-value">Hash: #?</div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12 game-container">
                <div id="grid-container">
                    <!-- SVG grid will be inserted here by JavaScript -->
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12 text-center">
                <h3 class="mines-title">Select mines count</h3>
                <div class="mines-buttons">
                    <button class="btn btn-mine active" data-mines="3">3</button>
                    <button class="btn btn-mine" data-mines="4">4</button>
                    <button class="btn btn-mine" data-mines="5">5</button>
                    <button class="btn btn-mine" data-mines="6">6</button>
                    <button class="btn btn-mine" data-mines="7">7</button>
                    <button class="btn btn-mine" data-mines="8">8</button>
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12 text-center">
                <button id="randomStars" class="btn btn-primary btn-lg">Get Signal</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
